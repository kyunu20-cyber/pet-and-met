<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet & Met — 데모</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; touch-action: none; }
    body { background: #fdf6f0; height: 100dvh; overflow: hidden; font-family: system-ui, sans-serif; display: flex; justify-content: center; }
    .card-stack { position: relative; width: 100%; height: 100%; }
    .card {
      position: absolute; inset: 0;
      border-radius: 24px; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      cursor: grab; user-select: none;
      transform-origin: center bottom;
      transition: transform 0.1s;
    }
    .card:active { cursor: grabbing; }
    .card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
    }
    .card-info { position: absolute; bottom: 24px; left: 24px; right: 24px; color: white; }
    .stamp {
      position: absolute; top: 40px;
      font-size: 24px; font-weight: 900; border: 4px solid; border-radius: 12px;
      padding: 4px 12px; opacity: 0; transition: opacity 0.15s;
    }
    .stamp-like { left: 20px; color: #34d399; border-color: #34d399; transform: rotate(-12deg); }
    .stamp-pass { right: 20px; color: #fb7185; border-color: #fb7185; transform: rotate(12deg); }
    .btn {
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 24px; border: none; cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }
    .btn:active { transform: scale(0.85) !important; }
    .btn:hover { transform: scale(1.1); }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px); z-index: 50;
      display: none; align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: linear-gradient(to bottom, #fdf4ff, #f5f3ff);
      border-radius: 28px; padding: 36px 28px; max-width: 340px; width: 90%;
      text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.25);
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes nudgeLeft { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    @keyframes nudgeRight { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-6px); } }
    @keyframes heartBeat { 0%,100% { transform: scale(0.8); } 50% { transform: scale(1.4); } }
    .pet-left { animation: nudgeLeft 1.2s ease-in-out infinite; display: inline-block; font-size: 48px; }
    .pet-heart { animation: heartBeat 1.2s ease-in-out infinite; display: inline-block; font-size: 20px; }
    .pet-right { animation: nudgeRight 1.2s ease-in-out infinite; display: inline-block; font-size: 48px; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
  </style>
</head>
<body>
<div style="width:100%;max-width:400px;height:100dvh;display:flex;flex-direction:column;">
 
  <!-- 헤더 -->
  <header style="padding:24px 16px 8px;display:flex;justify-content:space-between;align-items:flex-start;">
    <div>
      <h1 style="font-size:20px;font-weight:900;color:#9333ea;margin:0;">🐾 Pet &amp; Met</h1>
      <p style="font-size:11px;color:#9ca3af;margin:4px 0 0;">동물로 만나, 인연으로 이어져</p>
    </div>
    <div id="count-badge" style="background:white;border-radius:999px;padding:4px 12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);font-size:13px;font-weight:600;color:#4b5563;">4마리 남음</div>
  </header>
 
  <!-- 카드 영역 -->
  <div style="flex:1;padding:8px 16px;position:relative;" id="card-area">
    <div class="card-stack" id="card-stack"></div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <div style="font-size:64px;margin-bottom:16px;">🐾</div>
      <h2 style="font-size:20px;font-weight:700;color:#6b7280;margin-bottom:8px;">오늘의 친구들을 모두 만났어요!</h2>
      <p style="font-size:13px;color:#9ca3af;">내일 또 새로운 친구들이 기다리고 있어요</p>
    </div>
  </div>
 
  <!-- 버튼 -->
  <div style="padding:16px 16px 32px;display:flex;justify-content:center;align-items:center;gap:28px;">
    <button class="btn" id="btn-pass" style="width:60px;height:60px;background:white;border:2px solid #fecdd3;font-size:26px;" onclick="swipe('left')">💔</button>
    <button class="btn" id="btn-like" style="width:76px;height:76px;background:linear-gradient(135deg,#34d399,#0d9488);font-size:32px;" onclick="swipe('right')">💚</button>
    <button class="btn" style="width:60px;height:60px;background:white;border:2px solid #fef08a;font-size:26px;">⭐</button>
  </div>
</div>
 
<!-- 매칭 모달 -->
<div class="modal-backdrop" id="match-modal">
  <div class="modal-card">
    <div style="margin-bottom:16px;">
      <span class="pet-left">🐶</span>
      <span class="pet-heart">💞</span>
      <span class="pet-right">🐱</span>
    </div>
    <h2 style="font-size:24px;font-weight:900;color:#9333ea;margin:0 0 4px;">매칭됐어요!</h2>
    <p style="font-size:13px;color:#6b7280;margin:0 0 20px;"><span id="modal-name" style="font-weight:700;color:#374151;"></span>님도 당신을 좋아해요 🎉</p>
    <div style="background:white;border-radius:16px;padding:16px;margin-bottom:20px;border:1px solid #ede9fe;">
      <p style="font-size:11px;color:#9ca3af;margin:0 0 4px;">인스타그램 ID</p>
      <p id="modal-insta" style="font-size:18px;font-weight:700;color:#1f2937;margin:0;"></p>
    </div>
    <a id="modal-dm-btn" href="#" target="_blank"
      style="display:block;background:linear-gradient(135deg,#9333ea,#ec4899);color:white;font-weight:700;padding:14px;border-radius:16px;text-decoration:none;margin-bottom:8px;">
      DM 보내기 📩
    </a>
    <button onclick="closeModal()" style="background:none;border:none;color:#9ca3af;font-size:13px;cursor:pointer;padding:8px;">계속 둘러볼게요</button>
  </div>
</div>
 
<script>
const profiles = [
  { id:'4', nickname:'쫀득이', petType:'🐕 포메라니안', bio:'작지만 에너지는 대형견급 ⚡ 같이 뛰어놀 친구 구해요', instagramId:'jjondeuk_pom', photo:'https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=500&h=700&fit=crop' },
  { id:'3', nickname:'복실이', petType:'🐇 미니렉스', bio:'당근이라면 밤새도 Ok 🥕 겉은 도도, 속은 살랑살랑', instagramId:'boksil_rabbit', photo:'https://images.unsplash.com/photo-1585110396000-c9ffd4e4b308?w=500&h=700&fit=crop' },
  { id:'2', nickname:'냥냥이', petType:'🐈 러시안블루', bio:'창가에서 햇살 받는 게 제일 행복해요 ☀️ 차분하지만 한 번 빠지면 끝', instagramId:'nyangnyang_blue', photo:'https://images.unsplash.com/photo-1574158622682-e40e69881006?w=500&h=700&fit=crop' },
  { id:'1', nickname:'골든이', petType:'🐕 골든리트리버', bio:'공원 산책을 사랑하는 골든이예요 🌿 간식 앞에서는 눈이 동그래져요', instagramId:'golden_paw_kr', photo:'https://images.unsplash.com/photo-1552053831-71594a27632d?w=500&h=700&fit=crop' },
];
 
let stack = [...profiles];
let isDragging = false, startX = 0, startY = 0, currentCard = null, currentX = 0;
 
function updateBadge() {
  document.getElementById('count-badge').textContent = stack.length + '마리 남음';
}
 
function buildCards() {
  const el = document.getElementById('card-stack');
  el.innerHTML = '';
  stack.slice(-2).forEach((p, i, arr) => {
    const isTop = i === arr.length - 1;
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = p.id;
    card.style.transform = isTop ? 'scale(1)' : 'scale(0.95)';
    card.style.zIndex = isTop ? 2 : 1;
    card.innerHTML = `
      <img src="${p.photo}" alt="${p.nickname}" />
      <div class="card-overlay"></div>
      <div class="card-info">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
          <span style="font-size:22px;font-weight:900;">${p.nickname}</span>
          <span style="background:rgba(255,255,255,0.2);backdrop-filter:blur(4px);font-size:12px;padding:2px 8px;border-radius:999px;">${p.petType}</span>
        </div>
        <p style="font-size:13px;color:rgba(255,255,255,0.85);line-height:1.5;margin:0;">${p.bio}</p>
      </div>
      <div class="stamp stamp-like">LIKE 💚</div>
      <div class="stamp stamp-pass">PASS 💔</div>
    `;
    if (isTop) attachDrag(card, p);
    el.appendChild(card);
  });
}
 
function attachDrag(card, profile) {
  function onStart(e) {
    isDragging = true; currentCard = card;
    startX = (e.touches ? e.touches[0].clientX : e.clientX);
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    card.style.transition = 'none';
  }
  function onMove(e) {
    if (!isDragging) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
    const rotate = x * 0.1;
    currentX = x;
    card.style.transform = `translateX(${x}px) rotate(${rotate}deg) scale(1)`;
    const likeStamp = card.querySelector('.stamp-like');
    const passStamp = card.querySelector('.stamp-pass');
    likeStamp.style.opacity = Math.min(Math.max(x / 100, 0), 1);
    passStamp.style.opacity = Math.min(Math.max(-x / 100, 0), 1);
  }
  function onEnd() {
    if (!isDragging) return;
    isDragging = false;
    if (currentX > 100) animateOut(card, profile, 'right');
    else if (currentX < -100) animateOut(card, profile, 'left');
    else {
      card.style.transition = 'transform 0.4s cubic-bezier(0.34,1.56,0.64,1)';
      card.style.transform = 'scale(1)';
      card.querySelector('.stamp-like').style.opacity = 0;
      card.querySelector('.stamp-pass').style.opacity = 0;
    }
    currentX = 0;
  }
  card.addEventListener('mousedown', onStart);
  card.addEventListener('touchstart', onStart, { passive: true });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: true });
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchend', onEnd);
}
 
function animateOut(card, profile, direction) {
  const tx = direction === 'right' ? 600 : -600;
  card.style.transition = 'transform 0.35s ease-in, opacity 0.35s';
  card.style.transform = `translateX(${tx}px) rotate(${direction === 'right' ? 20 : -20}deg)`;
  card.style.opacity = '0';
  setTimeout(() => {
    stack = stack.filter(p => p.id !== profile.id);
    updateBadge();
    if (stack.length === 0) {
      document.getElementById('card-stack').innerHTML = '';
      document.getElementById('empty-state').style.display = 'flex';
    } else {
      buildCards();
    }
    // 매칭 체크: id 홀수이면 매칭
    if (direction === 'right' && Number(profile.id) % 2 === 1) {
      setTimeout(() => showMatch(profile), 200);
    }
  }, 350);
}
 
function swipe(direction) {
  if (stack.length === 0) return;
  const top = stack[stack.length - 1];
  const card = document.querySelector(`.card[data-id="${top.id}"]`);
  if (card) animateOut(card, top, direction);
}
 
function showMatch(profile) {
  document.getElementById('modal-name').textContent = profile.nickname;
  document.getElementById('modal-insta').textContent = '@' + profile.instagramId;
  document.getElementById('modal-dm-btn').href = 'https://instagram.com/' + profile.instagramId;
  document.getElementById('match-modal').classList.add('open');
}
 
function closeModal() {
  document.getElementById('match-modal').classList.remove('open');
}
 
// 배경 클릭으로 모달 닫기
document.getElementById('match-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
 
buildCards();
updateBadge();
</script>
</body>
</html>
