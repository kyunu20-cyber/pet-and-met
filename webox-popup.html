<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도전장보기 크루 - WiBox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* ── 폰 프레임 ── */
    .phone {
      width: 375px;
      height: 812px;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08);
    }

    /* ── 앱 배경 ── */
    .app-bg {
      width: 100%;
      height: 100%;
      background: #ebebeb;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .app-header {
      height: 52px;
      background: #3d3d3d;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-header span {
      color: white;
      font-size: 16px;
      font-weight: 700;
    }

    .app-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px;
      overflow: hidden;
      filter: blur(1.5px);
    }

    .dummy-card {
      background: white;
      border-radius: 14px;
      height: 150px;
    }

    .dummy-card.accent {
      background: linear-gradient(135deg, #d8f5f2, #b8eae5);
    }

    /* ── 오버레이 ── */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
      border-radius: 44px;
      display: flex;
      align-items: flex-end;
    }

    /* ── WiBox 팝업 카드 ── */
    .webox-card {
      width: 100%;
      background: #efefef;
      border-radius: 26px 26px 0 0;
      padding: 20px 16px 10px;
      animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }

    /* 핸들바 */
    .handle {
      width: 40px;
      height: 4px;
      background: #ccc;
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    /* ── 타이틀 박스 ── */
    .title-box {
      background: #3c3c3c;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-bottom: 8px;
    }

    .title-box span {
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    /* ── 설명 박스 ── */
    .desc-box {
      background: #484848;
      border-radius: 10px;
      padding: 11px 14px;
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .desc-box p {
      color: #d8d8d8;
      font-size: 12.5px;
    }

    .desc-box p strong {
      color: #fff;
    }

    /* ── 로고 박스 ── */
    .logo-box {
      background: #383838;
      border-radius: 16px;
      padding: 26px 16px 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
    }

    /* 로고 박스 배경 광택 */
    .logo-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 100%);
      border-radius: 16px 16px 0 0;
    }

    /* ── 도전장보기 로고 컨테이너 ── */
    .logo-container {
      position: relative;
      display: inline-block;
    }

    /* 로고 메인 텍스트 */
    .logo-text {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 62px;
      font-weight: 900;
      letter-spacing: -3px;
      color: #7de8de;
      /* 아웃라인: 흰색 외곽선 + 테두리 */
      -webkit-text-stroke: 3px #5bbfb5;
      text-shadow:
        -4px -4px 0 #4aada3,
         4px -4px 0 #4aada3,
        -4px  4px 0 #4aada3,
         4px  4px 0 #4aada3,
         0    6px 0 #3a9d93,
         0    0  12px rgba(100,220,210,0.3);
      line-height: 1;
      display: block;
      position: relative;
    }

    /* 흰색 내부 아웃라인 효과 */
    .logo-text::before {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 62px;
      font-weight: 900;
      letter-spacing: -3px;
      color: transparent;
      -webkit-text-stroke: 7px white;
      z-index: -1;
    }

    /* ── 아이콘들 ── */
    .logo-icons {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 4px;
      top: -18px;
    }

    .icon-bubble {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #7de8de, #4ec9bf);
      border-radius: 50%;
      border: 2.5px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    }

    /* 장식 점들 */
    .dot {
      position: absolute;
      border-radius: 50%;
      background: #7de8de;
      opacity: 0.6;
    }

    .dot-1 { width: 5px; height: 5px; top: 14px; right: 58px; }
    .dot-2 { width: 3px; height: 3px; top: 8px;  right: 46px; }
    .dot-3 { width: 4px; height: 4px; top: 16px; left: 48px;  }
    .dot-4 { width: 3px; height: 3px; top: 10px; left: 60px;  }

    /* ── CTA 버튼 ── */
    .cta-btn {
      width: 100%;
      background: #3c3c3c;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
      letter-spacing: -0.3px;
      transition: background 0.15s, transform 0.1s;
      font-family: inherit;
    }

    .cta-btn:active { transform: scale(0.98); background: #555; }

    /* ── 네 / 아니오 ── */
    .yn-wrap {
      background: #fff;
      border-radius: 50px;
      display: flex;
      align-items: stretch;
      border: 1px solid #ddd;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .yn-btn {
      flex: 1;
      padding: 13px 0;
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      color: #1a1a1a;
      transition: background 0.12s;
      font-family: inherit;
    }

    .yn-btn:active { background: #f0f0f0; }

    .yn-divider {
      width: 1px;
      background: #e0e0e0;
      align-self: stretch;
    }
  </style>
</head>
<body>

<div class="phone">
  <!-- 앱 배경 -->
  <div class="app-bg">
    <div class="app-header">
      <span>신청</span>
    </div>
    <div class="app-grid">
      <div class="dummy-card"></div>
      <div class="dummy-card accent"></div>
      <div class="dummy-card accent"></div>
      <div class="dummy-card"></div>
      <div class="dummy-card"></div>
      <div class="dummy-card accent"></div>
    </div>
  </div>

  <!-- 반투명 오버레이 + 팝업 -->
  <div class="overlay">
    <div class="webox-card">

      <div class="handle"></div>

      <!-- 타이틀 -->
      <div class="title-box">
        <span>도전장보기 크루</span>
      </div>

      <!-- 설명 -->
      <div class="desc-box">
        <p>혼자서 도전하기 어려웠던 일,</p>
        <p>이제 <strong>함께 도전할 수 있는 '장'</strong>을 만들어 드릴게요!</p>
      </div>

      <!-- 로고 박스 -->
      <div class="logo-box">
        <div class="logo-container">
          <!-- 아이콘 (텍스트 위) -->
          <div class="logo-icons">
            <div class="icon-bubble">✊</div>
            <div class="icon-bubble">🛒</div>
          </div>
          <!-- 장식 점들 -->
          <span class="dot dot-1"></span>
          <span class="dot dot-2"></span>
          <span class="dot dot-3"></span>
          <span class="dot dot-4"></span>
          <!-- 메인 텍스트 -->
          <span class="logo-text" data-text="도전장보기">도전장보기</span>
        </div>
      </div>

      <!-- CTA 버튼 -->
      <button class="cta-btn">도전'장' 보러가기</button>

      <!-- 네 / 아니오 -->
      <div class="yn-wrap">
        <button class="yn-btn">네</button>
        <div class="yn-divider"></div>
        <button class="yn-btn">아니오</button>
      </div>

    </div>
  </div>
</div>

</body>
</html>
